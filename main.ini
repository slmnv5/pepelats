; Do not change this file, it is restored by update. Edit user.ini instead

;max_len_seconds -- how long a loop may be.
max_len_seconds : 90

;samples_volume -- only for Style drum. Use it if drum samples (WAV files) volume needs adjustment
samples_volume : 0.5

;audio_names -- names (or part of names) of audio devices, case-sensitive
audio_names : USB Audio Device, JME STOMPBOX, Microsoft Sound Mapper

;midi_in_names  -- names (or part of names) for MIDI input controls, case-sensitive
midi_in_names : BlueBoard, FootCtrlPlus, kbd_midi_out

;keyboard_keys  -- keys on computer keyboard if using keyboard as MIDI IN
keyboard_keys : 1, 2, 3, 4, q, w
;keyboard_keys : `, 4, 8, =, pgup, kp-

;midi_values -- MIDI notes (or CC) sent by each button, integers from 0 to 127
midi_values : 60, 62, 64, 65, 12, 13

