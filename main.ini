; Do not change this file, it is restored by update. Edit user.ini instead

;max_len_seconds -- how long a loop may be.
max_len_seconds : 90

;audio_names -- case-sensitive names (or part of names) of audio devices
audio_names : USB Audio Device, JME STOMPBOX, Microsoft Sound Mapper, Aggregate Device,

;midi_in_names  -- case-sensitive names (or part of names) for MIDI input, used for control
midi_in_names : BlueBoard, FootCtrlPlus, Guitar Wing, kbd_midi

;midi_out_names  -- case-sensitive names (or part of names) for MIDI output, used for drums, optional
midi_out_names : VALETON, Ipad, iPad, FM1, Network

;midi_values -- MIDI notes (or CC) sent by each button, integers from 0 to 127
midi_values : 60, 62, 64, 65, 12, 13

