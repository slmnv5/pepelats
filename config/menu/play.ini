[default]
; default included in all sections
E1 : _menu_change
E6 : _menu_change play
E7 : _menu_change song
E8 : _menu_change serv

E2 : _menu_part undo
E3 : _menu_part redo

F1 : _menu_drum randomize
F2 : _menu_drum break
F3 : _menu_drum stop
F6 : _menu_stop fast
F7 : _menu_stop slow

[section to show and control song parts]
description : parts A..D-play E-undo F-drum
show : _show_parts
; select next part to play / record
A : _menu_part_select 0
B : _menu_part_select 1
C : _menu_part_select 2
D : _menu_part_select 3
; next part will start with recording
A2 : _menu_part arm
B2 : _menu_part arm
C2 : _menu_part arm
D2 : _menu_part arm
; fast switch to next part when bar ends
A3 : _menu_part change_fast
B3 : _menu_part change_fast
C3 : _menu_part change_fast
D3 : _menu_part change_fast
; clear next part while current plays
A6 : _menu_part clear_next
B6 : _menu_part clear_next
C6 : _menu_part clear_next
D6 : _menu_part clear_next

[section to show and control loops for current part]
description : loops A1/2-scroll B1-silent B2-move_down BH-delete C2-merge, C3-merge_all
show : _show_loops
; select loop
A1 : _menu_loop next
A2 : _menu_loop prev
; action on loop
B1 : _menu_loop silent
B2 : _menu_loop move_down
B6 : _menu_loop delete
; merge selected and below, merge all loops
C2 : _menu_loop merge
C3 : _menu_loop merge_all






