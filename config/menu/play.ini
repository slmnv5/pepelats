[default]
; default included in all sections
E6 : _menu_change
E7 : _menu_change song
E8 : _menu_change serv

E1 : _menu_part_undo_current
E2 : _menu_part_redo_current

F1 : _menu_drum randomize
F2 : _menu_drum break
F3 : _menu_drum stop
F6 : _menu_stop fast
F7 : _menu_stop slow

[section to show and control song parts]
description : parts A..D-play E-undo F-drum
show : _show_parts
; select next part to play / record when current part ends
A : _menu_part_select 0
B : _menu_part_select 1
C : _menu_part_select 2
D : _menu_part_select 3
; next part will start with recording, current part adds to the latest loop
A2 : _menu_part_arm_next_overdub_current
B2 : _menu_part_arm_next_overdub_current
C2 : _menu_part_arm_next_overdub_current
D2 : _menu_part_arm_next_overdub_current
; fast jump to next part when bar ends
A3 : _menu_part_jump_next
B3 : _menu_part_jump_next
C3 : _menu_part_jump_next
D3 : _menu_part_jump_next
; clear next part while current plays
A6 : _menu_part_clear_next
B6 : _menu_part_clear_next
C6 : _menu_part_clear_next
D6 : _menu_part_clear_next

[section to show and control loops for current part]
description : loops A1/2-scroll B1-silent B2-move_down BH-delete C2-merge
show : _show_loops
; select loop
A1 : _menu_loop next
A2 : _menu_loop prev
; act on selected loop
B1 : _menu_loop silent
B2 : _menu_loop move_down
B6 : _menu_loop delete
; merge selected loop and all loops below 
C2 : _menu_loop merge






