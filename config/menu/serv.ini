[default]
; this is included in all sections
E1 : _menu_change
E6 : _menu_change play
E7 : _menu_change song
E8 : _menu_change serv

F1 : _menu_drum randomize
F2 : _menu_drum break
F3 : _menu_drum stop
F6 : _menu_stop fast

[serv.0]
description : service B2-restart
show : _show_info
B2 : _exit


[serv.1]
description : drum A1-vol_dn A2-vol_up B1-par_dn B2-par_up C1-style C2-loop C3-midi
show : _show_drum_param
A1 : _menu_drum_volume 0.83
A2 : _menu_drum_volume 1.2
B1 : _menu_drum_param -0.1
B2 : _menu_drum_param 0.1
C1 : _menu_drum_type StyleDrum: _menu_change play
C2 : _menu_drum_type LoopDrum: _menu_change play
C3 : _menu_drum_type MidiDrum: _menu_change play


