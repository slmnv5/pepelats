name: Update Latest Release Assets

# Triggers the workflow every time you push changes to your main branch
on:
  push:
    branches:
      - main

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Allows the script to create/edit releases

    steps:
      # 1. Pull down your repository code
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. Make huge ZIP on server. Tiny change will not push the whole 11-MB ZIP
      - name: Create ZIP Archive
        run: |
          # Create the initial ZIP
          if [ -f pepelats.zip ]; then rm pepelats.zip; fi
          zip pepelats.zip ./main.ini ./index.html ./favicon.ico ./loop.sh ./README.md
          
          # Append folders to the existing pepelats.zip archive using the -g flag
          zip -rg pepelats.zip ./config/ ./html/
          zip -rg pepelats.zip ./main.dist/
          zip -rg pepelats.zip ./bindir/
          echo "ZIP created"

      # 3. Create or update a rolling "latest" release tag on GitHub
      - name: Upload to Release
        uses: ncipollo/release-action@v1
        with:
          artifacts: "install.sh,pepelats.zip"
          tag: "latest"
          name: "Latest Rolling Build"
          allowUpdates: true # Overwrites the old ZIP files with the new one
          removeArtifacts: true # Cleans out the previous assets first


